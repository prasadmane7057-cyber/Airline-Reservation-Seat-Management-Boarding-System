services:
  - type: web
    name: skywings-api
    runtime: node
    plan: starter
    rootDir: airline-backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: skywings-user-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CSV_USERS_PATH
        value: /var/data/users.csv
      - key: FRONTEND_ORIGIN
        value: https://prasadmane7057-cyber.github.io
